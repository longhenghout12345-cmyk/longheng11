<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html,body{
            height: 100%;
            margin: 0;
        }
        body{
            display:flex;
            justify-content: center;
            align-items: center;
        }
        form{
            width: 350px;
            height: 200px;
            padding: 10px;
            border: 1px solid gray;
            border-radius: 5px;
            background-color: aliceblue;
            box-shadow: 1px 1px 1px 1px rgb(230,225,225);
        } 
        input[type="text"] {
            width: 220px;
            height: 35px;
        }
        input[type="password"] {
            width: 220px;
            height: 35px;
        }
    </style>
    

 <body>
    <form action="">
        <div class="formcontroller">
            <label for="username">username:</label>
            <input
            type="text"
            id="username"
            placeholder="put username"
            name="username"
            />
        </div>
        <div class="formcontroller">
            <label for="password" >password:</label>
            <input type="password" id="password" placeholder="put password" name="password"
            />
        </div>
        <div class="formcontroller">
            <button type="submit">LOGIN</button>
        </div>
    </form>
</body>
</html>
</body>
</html>
